[project]
name = "karaoke"
version = "0.1.0"
description = "Karaoké live : manifeste → dossiers prêts à jouer"
authors = [
    { name = "akkaouim", email = "akkaouim@gmail.com" }
]
requires-python = ">=3.11,<3.12"
dependencies = [
    "httpx>=0.28.1",
    "mutagen>=1.48.1",
    "numpy>=2.4.6",
    "pillow>=12.3.0",
    "pyphen>=0.18.1",
    "soundfile>=0.14.0",
    "typer>=0.27.3",
]

[project.scripts]
karaoke = "karaoke.cli:app"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
markers = ["slow: runs the real ML models (minutes); run with -m slow"]
addopts = "-m 'not slow'"
